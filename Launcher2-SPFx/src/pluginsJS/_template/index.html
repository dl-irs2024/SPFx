<!doctype html>
<!-- Only needed for hostMode "iframe". Serve from a different origin than the launcher page. -->
<html>
  <head><meta charset="utf-8" /><title>My plugin</title></head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { connect } from '../_shared/launcher-bridge.js';
      import plugin from './index.js';
      const ctx = await connect();
      await plugin.init?.(ctx);
      await plugin.mount(document.getElementById('app'), ctx);
    </script>
  </body>
</html>
